replicaCount: 1

image:
  source: ghcr.io/syntax3rror404/k8s-devmachine@sha256:0bf507b2a2cdf3943e575e026e248875a08faea378cf7d6ab255e91336fa616c
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 2222
  targetPort: 2222
  labels:
    ciliuml2: pool


persistence:
  enabled: true
  size: 10Gi
  storageClass: "longhorn"

resources: {}

ssh:
  authorizedKeys: |
    # Place auth keys here ...
    # ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCu...
    

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
