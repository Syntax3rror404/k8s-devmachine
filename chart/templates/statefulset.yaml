---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: {{ .Values.replicaCount }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.source }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        securityContext:
          runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
          runAsUser: {{ .Values.securityContext.runAsUser }}
          runAsGroup: {{ .Values.securityContext.runAsGroup }}
          allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
          seccompProfile:
            type: {{ .Values.securityContext.seccompProfile.type }}
        volumeMounts:
        - name: home-volume
          mountPath: /home/dev
        - name: entrypoint-script
          mountPath: /usr/local/bin/entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
        - name: ssh-keys
          mountPath: /home/dev/.ssh/authorized_keys
          subPath: authorized_keys
          readOnly: true
        - name: sshd-config-volume
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
          readOnly: true
        - name: pam-config-volume
          mountPath: /etc/pam.d/sshd
          subPath: sshd
          readOnly: true
        - name: bashrc
          mountPath: /home/dev/.bashrc
          subPath: .bashrc
          readOnly: true
        - name: bash-profile
          mountPath: /home/dev/.bash_profile
          subPath: .bash_profile
          readOnly: true
        resources: {{ toYaml .Values.resources | indent 10 }}
      volumes:
      - name: entrypoint-script
        configMap:
          name: {{ .Release.Name }}-entrypoint
          defaultMode: 0755
      - name: ssh-keys
        configMap:
          name: {{ .Release.Name }}-ssh-keys
          defaultMode: 0755
      - name: sshd-config-volume
        configMap:
          name: {{ .Release.Name }}-sshd-config
          defaultMode: 0755
      - name: pam-config-volume
        configMap:
          name: {{ .Release.Name }}-pam-config
          defaultMode: 0755
      - name: bashrc
        configMap:
          name: {{ .Release.Name }}-bashrc
          defaultMode: 0644
      - name: bash-profile
        configMap:
          name: {{ .Release.Name }}-bash-profile
          defaultMode: 0644
  volumeClaimTemplates:
  - metadata:
      name: home-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}